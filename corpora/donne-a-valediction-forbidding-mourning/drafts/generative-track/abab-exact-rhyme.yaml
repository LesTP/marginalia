  locator:
    scheme: line
    value: 25-36
  exact_text: 'If they be two; they are two so

    As stiffe twin compasses are two,

    Thy soule the fixt foot, makes no show

    To move, but doth, if th''other doe.


    And though it in the center sit,

    Yet when the other far doth rome,

    It leanes, and hearkens after it,

    And growes erect, as that comes home.


    Such wilt thou be to mee, who must

    Like th''other foot, obliquely runne,

    Thy firmnes makes my circle just,

    And makes me end, where I begunne.'
annotation_type: formal
claim:
  body: The three stanzas rhyme abab throughout, each quatrain closing on single end-rhymes (so/show,
    two/doe; sit/it, rome/home; must/just, runne/begunne). The regular alternating scheme is directly
    observable in the base text and lends the argument its measured, closed movement.
  epistemic_status: documented-fact

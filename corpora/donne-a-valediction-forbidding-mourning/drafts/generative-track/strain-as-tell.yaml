  work_id: work_a_valediction_forbidding_mourning
  edition_source_id: src_d933303080412160
  locator:
    scheme: line
    value: 25-36
  exact_text: 'If they be two; they are two so

    As stiffe twin compasses are two,

    Thy soule the fixt foot, makes no show

    To move, but doth, if th''other doe.


    And though it in the center sit,

    Yet when the other far doth rome,

    It leanes, and hearkens after it,

    And growes erect, as that comes home.


    Such wilt thou be to mee, who must

    Like th''other foot, obliquely runne,

    Thy firmnes makes my circle just,

    And makes me end, where I begunne.'
annotation_type: thematic
claim:
  body: 'The speaker meets the fact of parting not with open feeling but with an elaborate geometric proof,
    the twin compasses. One way to read that elaborateness is as a sign of need: were the union as secure
    as the argument claims, it might not require so intricate a machine to establish it, so that the strain
    of the conceit becomes part of its meaning. The lines equally support the opposite reading, in which
    the compass is a confident, even triumphant demonstration -- "Thy firmnes makes my circle just" --
    and the ingenuity marks assurance rather than anxiety. This note offers the first reading as a possibility
    while recording that the text sustains both.'
  epistemic_status: editorial-proposal
  editorial_confidence:
    level: unassessed
    rationale: Offered as a reading the text permits but does not compel; the competing confident reading
      is carried in the body. Status-aware stage-6 verification found it defensible but contested.

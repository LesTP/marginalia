    .poem-lines--historical-forms .poem-line__text {
      font-family: "IM FELL English", var(--poem-serif);
      font-variant-alternates: historical-forms;
      font-feature-settings: "hist" 1, "liga" 1;
    }

    :root {
      --paper: #f3f0e6;
      --paper-light: #fbf9f2;
      --ink: #17221f;
      --ink-soft: #56605a;
      --moon: #476f80;
      --moon-pale: rgba(71, 111, 128, 0.14);
      --gold: #a66f29;
      --rule: rgba(23, 34, 31, 0.2);
      --rule-strong: rgba(23, 34, 31, 0.38);
      --display-serif: "Iowan Old Style", Baskerville, "Palatino Linotype", Palatino, Georgia, serif;
      --serif: "Iowan Old Style", Baskerville, "Palatino Linotype", Palatino, Georgia, serif;
      --poem-serif: "Libre Caslon Text", "Iowan Old Style", Baskerville, "Palatino Linotype", Palatino, Georgia, serif;
      --sans: "Gill Sans", "Trebuchet MS", Candara, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-width: 20rem;
      margin: 0;
      color: var(--ink);
      background:
        repeating-linear-gradient(0deg, rgba(23, 34, 31, 0.018) 0 1px, transparent 1px 5px),
        var(--paper);
      font-family: var(--serif);
    }

    button,
    select {
      font: inherit;
    }

    button:focus-visible,
    select:focus-visible,
    summary:focus-visible,
    a:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid var(--moon);
      outline-offset: 3px;
    }

    [hidden] {
      display: none !important;
    }

    .skip-link {
      position: fixed;
      z-index: 30;
      top: 0.5rem;
      left: 0.5rem;
      padding: 0.7rem 1rem;
      color: var(--paper-light);
      background: var(--ink);
      transform: translateY(-160%);
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .masthead {
      display: grid;
      grid-template-columns: 3rem minmax(0, 1fr) auto;
      gap: 1rem;
      align-items: center;
      max-width: 92rem;
      margin: 0 auto;
      padding: 2.2rem clamp(1.25rem, 4vw, 4rem) 1.8rem;
      border-bottom: 1px solid var(--rule);
    }

    .masthead__mark {
      display: grid;
      width: 2.8rem;
      height: 2.8rem;
      place-items: center;
      color: var(--gold);
      text-decoration: none;
      border: 1px solid var(--gold);
      border-radius: 50%;
      font-size: 1.2rem;
    }

    .masthead__title {
      min-width: 0;
    }

    .masthead__author {
      margin: 0 0 0.45rem;
      color: var(--ink-soft);
      font-family: var(--sans);
      font-size: 1.02rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .eyebrow,
    .notes-toggle,
    .projection-label,
    .projection-status,
    .source-meta,
    .stage-kicker {
      font-family: var(--sans);
      letter-spacing: 0;
    }

    .eyebrow {
      margin: 0 0 0.35rem;
      color: var(--ink-soft);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .masthead h1 {
      max-width: none;
      margin: 0;
      overflow-wrap: normal;
      font-family: var(--display-serif);
      font-size: 3rem;
      font-weight: 400;
      line-height: 1.02;
    }

    .notes-toggle {
      justify-self: end;
      min-height: 2.7rem;
      padding: 0.55rem 1.3rem;
      color: var(--paper-light);
      border: 1px solid var(--moon);
      border-radius: 0.5rem;
      background: var(--moon);
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 160ms ease, color 160ms ease, border-color 160ms ease;
    }

    .notes-toggle[aria-pressed="false"] {
      color: var(--ink-soft);
      background: transparent;
      border-color: var(--rule-strong);
    }

    .notes-toggle:hover,
    .notes-toggle:focus-visible {
      outline: none;
      color: var(--paper-light);
      border-color: var(--moon);
      background: var(--moon);
    }

    .projection-bar {
      margin: 0 0 1.8rem;
      padding: 0 0 1.2rem;
      border-bottom: 1px solid var(--rule-strong);
    }

    .projection-bar__inner {
      display: grid;
      gap: 0.8rem;
    }

    .focus-filter {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    .projection-label {
      color: var(--ink-soft);
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .focus-options {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: 0.4rem;
    }

    .focus-option {
      min-height: 2.25rem;
      padding: 0.4rem 0.85rem;
      color: var(--ink-soft);
      border: 1px solid var(--rule-strong);
      border-radius: 0.45rem;
      background: transparent;
      font-family: var(--sans);
      font-size: 0.74rem;
      cursor: pointer;
    }

    .focus-option:hover,
    .focus-option:focus-visible {
      color: var(--ink);
      border-color: var(--moon);
    }

    .focus-option[aria-pressed="true"] {
      color: var(--paper-light);
      border-color: var(--moon);
      background: var(--moon);
    }

    .projection-status {
      margin: 0;
      color: var(--ink-soft);
      font-size: 0.72rem;
    }

    .reading-layout {
      display: grid;
      grid-template-columns: minmax(24rem, 0.82fr) minmax(28rem, 1.18fr);
      max-width: 92rem;
      margin: 0 auto;
    }

    .reading-layout--notes-hidden {
      grid-template-columns: minmax(0, 1fr);
    }

    .reading-layout--notes-hidden .notes-panel {
      display: none;
    }

    .reading-layout--notes-hidden .poem-panel {
      border-right: 0;
    }

    .reading-layout--notes-hidden .poem-sticky {
      position: static;
      max-width: 42rem;
      margin: 0 auto;
    }

    .poem-panel {
      min-width: 0;
      padding: 2.5rem clamp(1.25rem, 4vw, 4rem) 5rem;
      border-right: 1px solid var(--rule);
    }

    .poem-sticky {
      position: sticky;
      top: 1rem;
    }

    .text-selector {
      display: flex;
      gap: 0.35rem;
      margin-bottom: 1.2rem;
    }

    .text-selector button {
      padding: 0.4rem 0.75rem;
      border: 1px solid var(--rule);
      border-radius: 0.45rem;
      background: transparent;
      font-family: var(--sans);
      font-size: 0.72rem;
      cursor: pointer;
    }

    .text-selector button[aria-pressed="true"] {
      color: #fff;
      border-color: var(--moon);
      background: var(--moon);
    }

    .poem-lines {
      max-width: 37rem;
    }

    .poem-line {
      display: grid;
      grid-template-columns: 1.7rem minmax(0, 1fr);
      gap: 0.6rem;
      align-items: center;
      min-height: 2rem;
      border-left: 3px solid transparent;
      transition: color 160ms ease, background-color 160ms ease, border-color 160ms ease;
    }

    .poem-line--stanza {
      margin-top: 1.15rem;
    }

    .poem-line:first-child {
      margin-top: 0;
    }

    .poem-line__number {
      color: rgba(72, 84, 77, 0.62);
      font-family: var(--sans);
      font-size: 0.67rem;
      text-align: right;
      user-select: none;
    }

      font-weight: 700;

    }

      gap: 1rem;
      align-items: center;

      list-style: none;
    }

      display: none;
    }

      content: "+";

      font-family: var(--sans);

    }

      content: "−";

      font-size: 1.2rem;
      font-weight: 400;

    }

      }

tor"}],"id":"src_ce7b60f5c415155e","issue":null,"issued":"1912","notes":"Used to corroborate the 1633 wording, document variants, and distinguish the historical witness from later editorial choices. It does not control the base transcription.","pages":null,"publisher":"Clarendon Press","quality":{"authority":"scholarly-edition","peer_review_status":"editorially-reviewed","rationale":"Grierson collates the early printed editions and numerous manuscripts, records textual variants, and explains his preference for the 1633 text as the basis for poems it contains."},"rights":{"notes":"The 1912 edition and Project Gutenberg transcription are treated as public domain; users outside the United States should confirm local law.","quotation":"permitted","reproduction":"permitted","status":"public-domain"},"source_type":"critical-edition","source_type_detail":null,"title":"The Poems of John Donne, Volume I","volume":"I"},"source_id":"src_ce7b60f5c415155e","summary":"Grierson's text and apparatus expose where an edited reading differs from the 1633 witness, including punctuation, the added “and” in line 20, and manuscript or later-edition variants.","use":"direct-evidence"}],"id":"ann_4eb04173afdd26d0","is_base_text":false,"local_key":"transcription-modernization-policy","review":{"notes":"Human review compared every changed form across the two aligned views.","reviewed_on":"2026-09-28","reviewer":"LesTP","state":"human-reviewed"},"tags":["lens-text-history","modernization","transcription"],"target":{"exact_text":"AS virtuous men passe mildly away,\nAnd whisper to their soules, to goe,\nWhilst some of their sad friends doe say,\nThe breath goes now, and some say, no.\n\nSo let us melt, and make no noise,\nNo teare-floods, nor sigh-tempests move,\nT'were prophanation of our joyes\nTo tell the layetie our love.\n\nMoving of th'earth brings harmes and feares,\nMen reckon what it did and meant,\nBut trepidation of the spheares,\nThough greater farre, is innocent.\n\nDull sublunary lovers love\n(Whose soule is sense) cannot admit\nAbsence, because it doth remove\nThose things which elemented it.\n\nBut we by a love, so much refin'd,\nThat our selves know not what it is,\nInter-assured of the mind,\nCare lesse; eyes, lips, hands to misse.\n\nOur two soules therefore, which are one,\nThough I must goe, endure not yet\nA breach, but an expansion,\nLike gold to ayery thinnesse beate.\n\nIf they be two; they are two so\nAs stiffe twin compasses are two,\nThy soule the fixt foot, makes no show\nTo move, but doth, if th'other doe.\n\nAnd though it in the center sit,\nYet when the other far doth rome,\nIt leanes, and hearkens after it,\nAnd growes erect, as that comes home.\n\nSuch wilt thou be to mee, who must\nLike th'other foot, obliquely runne,\nThy firmnes makes my circle just,\nAnd makes me end, where I begunne.","fragments":[{"end":34,"line":1,"start":0},{"end":36,"line":2,"start":0},{"end":41,"line":3,"start":0},{"end":38,"line":4,"start":0},{"end":34,"line":5,"start":0},{"end":40,"line":6,"start":0},{"end":32,"line":7,"start":0},{"end":29,"line":8,"start":0},{"end":44,"line":9,"start":0},{"end":33,"line":10,"start":0},{"end":32,"line":11,"start":0},{"end":34,"line":12,"start":0},{"end":26,"line":13,"start":0},{"end":35,"line":14,"start":0},{"end":31,"line":15,"start":0},{"end":32,"line":16,"start":0},{"end":34,"line":17,"start":0},{"end":36,"line":18,"start":0},{"end":26,"line":19,"start":0},{"end":39,"line":20,"start":0},{"end":40,"line":21,"start":0},{"end":33,"line":22,"start":0},{"end":27,"line":23,"start":0},{"end":35,"line":24,"start":0},{"end":31,"line":25,"start":0},{"end":33,"line":26,"start":0},{"end":38,"line":27,"start":0},{"end":35,"line":28,"start":0},{"end":32,"line":29,"start":0},{"end":33,"line":30,"start":0},{"end":33,"line":31,"start":0},{"end":37,"line":32,"start":0},{"end":34,"line":33,"start":0},{"end":36,"line":34,"start":0},{"end":33,"line":35,"start":0},{"end":34,"line":36,"start":0}],"fragments_by_text":{"edition-fait  for Parting"},{"annotation_type":"thematic","claim":{"attributions":[],"body":"The speaker asks the lovers to “melt” apart without theatrical floods of tears or storms of sighs. Calling outsiders “the laity” gives the relationship a private, almost sacred knowledge: public display would expose something the uninitiated cannot fully understand. John Freccero hears an alchemical sense in “melt”: pure gold melts quietly and evenly because its spirit is perfectly joined to its body, unlike base metals that melt noisily, so the lovers are asked to part as gold does—without noise.","contested":false,"editorial_confidence":{"level":"unassessed","rationale":"The religious distinction between profanation and laity is present in the stanza; describing the lovers' knowledge as private and quasi-sacred is an editorial synthesis."},"epistemic_status":"editorial-synthesis"},"evidence":[{"citation":{"citation_text":"Donne, Poems (1633), 193.","locator":"p. 193, lines 5-8"},"id":"ev_profanation","relationship":"supports","source":{"access":{"consulted_on":"2026-09-26","obtained_via":"Internet Archive page images derived from the Google Books scan; printed pages 193-194 were inspected directly at scan leaves 208-209.","state":"fully-consulted"},"canonical_url":"https://archive.org/details/donnepoems","citation":"Donne, John. Poems, by J. Donne. With Elegies on the Authors Death. London: printed by Miles Flesher for John Marriot, 1633, 193-194. Internet Archive, donnepoems.","container_title":null,"contributors":[{"name":"John Donne","role":"author"}],"id":"src_d933303080412160","issue":null,"issued":"1633","notes":"The transcription was checked directly against https://archive.org/download/donnepoems/page/n208_w2000.jpg and https://archive.org/download/donnepoems/page/n209_w2000.jpg. OCR was used only to locate the pages.","pages":"193-194","publisher":"Miles Flesher for John Marriot","quality":{"authority":"primary-source","peer_review_status":"not-peer-reviewed","rationale":"The t; users should confirm rights before quoting.","quotation":"limited","reproduction":"prohibited","status":"copyrighted"},"source_type":"journal-article","source_type_detail":null,"title":"Donne's 'Valediction: Forbidding Mourning'","volume":"30"},"source_id":"src_d0ac9779e429149d","summary":"Freccero reads “melt” as alchemical liquefaction and contrasts the quiet, even melting of pure gold with the noisy melting of base metals, grounding the stanza's “make no noise.”","use":"direct-evidence"}],"id":"ann_b76a7bbae8f39a03","is_base_text":false,"local_key":"no-noise-profanation","review":{"notes":"Close reading reviewed by a human editor.","reviewed_on":"2026-09-28","reviewer":"LesTP","state":"human-reviewed"},"tags":["lens-form-argument","lens-bodies-souls","sacred-language"],"target":{"exact_text":"So let us melt, and make no noise,\nNo teare-floods, nor sigh-tempests move,\nT'were prophanation of our joyes\nTo tell the layetie our love.","fragments":[{"end":34,"line":5,"start":0},{"end":40,"line":6,"start":0},{"end":32,"line":7,"start":0},{"end":29,"line":8,"start":0}],"fragments_by_text":{"edition-faithful":[{"end":34,"line":5,"start":0},{"end":40,"line":6,"start":0},{"end":32,"line":7,"start":0},{"end":29,"line":8,"start":0}],"modernized":[{"end":34,"line":5,"start":0},{"end":39,"line":6,"start":0},{"end":30,"line":7,"start":0},{"end":27,"line":8,"start":0}]},"line_range":{"end":8,"start":5},"locator":{"scheme":"line","value":"5-8"},"work_id":"work_a_valediction_forbidding_mourning"},"title":"Why Display Would Profane the Love"},{"annotation_type":"historical-context","claim":{"attributions":[{"evidence_ids":["ev_trepidation_gloss"],"position":"“Trepidation” refers to precession of the equinoxes, then explained as movement of the ninth or crystalline sphere in Ptolemaic astronomy.","scholar":"E. K. Chambers, as quoted by Herbert J. C. Grierson"},{"evidence_ids":["ev_freccero_terrae_motus"],"position":"\"Moving of th'earth\" is an earthquake (terrae motus), a sublunary breach bringing floods and tempests, not a Copernican moving of the earth; the trepidation of the spheres is by contrast a harmless \"access and recess.\"","scholar":"John Freccero"}],"body":"The stanza contrasts a frightening, measurable earthquake with a vastly greater celestial movement that causes no alarm. The comparison makes visible disturbance a poor measure of importance. In Grierson's commentary, Chambers identifies “trepidation” with the precession of the equinoxes as explained through the movement of the ninth or crystalline sphere in Ptolemaic astronomy. John Freccero places the contrast in period cosmology: motion in the sublunary world below the moon was thought changeable and often violent, while the motion of the higher spheres was regular and benign, so the stanza measures the lovers' parting against the calm of the heavens rather than the alarm of the earth. He reads “Moving of th'earth” as an earthquake (terrae motus), a sublunary rupture that brings floods and tempests, rather than a Copernican moving of the earth, and hears in the “trepidation of the spheares” a gentle “access and recess,” a going and returning that does no harm.","contested":false,"editorial_confidence":{"level":"unassessed","rationale":"The contrast is explicit in the poem and the astronomical gloss is available through Grierson, but Chambers's original discussion has not been independently consulted."},"epistemic_status":"attributed-interpretation"},"evidence":[{"citation":{"citation_text":"Donne, Poems (1633), 193.","locator":"p. 193, lines 9-12"},"id":"ev_motion_contrast","relationship":"supports","source":{"access":{"consulted_on":"2026-09-26","obtained_via":"Internet Archive page images derived from the Google Books scan; printed pages 193-194 were inspected directly at scan leaves 208-209.","state":"fully-consulted"},"canonical_url":"https://archive.org/details/donnepoems","citation":"Donne, John. Poems, by J. Donne. With Elegies on the Authors Death. London: prin s University Press","quality":{"authority":"peer-reviewed-scholarship","peer_review_status":"peer-reviewed","rationale":"A peer-reviewed scholarly essay in ELH that reads the poem's compass conceit within Renaissance and Neoplatonic cosmology."},"rights":{"notes":"The essay is under copyright (ELH, Johns Hopkins University Press). The corpus paraphrases with short attributed phrases and does not reproduce the text; users should confirm rights before quoting.","quotation":"limited","reproduction":"prohibited","status":"copyrighted"},"source_type":"journal-article","source_type_detail":null,"title":"Donne's 'Valediction: Forbidding Mourning'","volume":"30"},"source_id":"src_d0ac9779e429149d","summary":"Freccero argues that “Moving of th'earth” is an earthquake (terrae motus), a sublunary breach, and rejects C. M. Coffin's reading of it as a Copernican moving of the earth; the trepidation of the spheres is by contrast a harmless access and recess.","use":"direct-evidence"}],"id":"ann_e55785f415f467d2","is_base_text":false,"local_key":"earthly-celestial-motion","review":{"notes":"Consult Chambers directly before treating the astronomical attribution as independently verified.","reviewed_on":"2026-09-28","reviewer":"LesTP","state":"human-reviewed"},"tags":["lens-form-argument","lens-geometry-cosmology","astronomy"],"target":{"exact_text":"Moving of th'earth brings harmes and feares,\nMen reckon what it did and meant,\nBut trepidation of the spheares,\nThough greater farre, is innocent.","fragments":[{"end":44,"line":9,"start":0},{"end":33,"line":10,"start":0},{"end":32,"line":11,"start":0},{"end":34,"line":12,"start":0}],"fragments_by_text":{"edition-faithful":[{"end":44,"line":9,"start":0},{"end":33,"line":10,"start":0},{"end":32,"line":11,"start":0},{"end":34,"line":12,"start":0}],"modernized":[{"end":42,"line":9,"start":0},{"end":33,"line":10,"start":0},{"end":31,"line":11,"start":0},{"end":32,"line":12,"start":0}]},"line_range":{"end":12,"start":9},"locator":{"scheme":"line","value":"9-12"},"work_id":"work_a_valediction_forbidding_mourning"},"title":"Earthquake and Celestial Motion"},{"annotation_type":"thematic","claim":{"attributions":[],"body":"These stanzas distinguish love composed from sensory presence from a bond so inwardly assured that it can survive missing eyes, lips, and hands. The speaker does not deny the body; he argues that this particular love is not exhausted by the bodily elements that absence removes. Grierson glosses “elemented” as “composed,” pointing forward to the poem's list of physical parts.","contested":false,"editorial_confidence":{"level":"unassessed","rationale":"The distinction and bodily list are explicit, while the account of their relationship is an editorial synthesis informed by Grierson's lexical note."},"epistemic_status":"editorial-synthesis"},"evidence":[{"citation":{"citation_text":"Donne, Poems (1633), 194.","locator":"p. 194, lines 13-20"},"id":"ev_refined_love","relationship":"supports","source":{"access":{"consulted_on":"2026-09-26","obtained_via":"Internet Archive page images derived from the Google Books scan; printed pages 193-194 were inspected directly at scan leaves 208-209.","state":"fully-consulted"},"canonical_url":"https://archive.org/details/donnepoems","citation":"Donne, John. Poems, by J. Donne. With Elegies on the Authors Death. London: printed by Miles Flesher for John Marriot, 1633, 193-194. Internet Archive, donnepoems.","container_title":null,"contributors":[{"name":"John Donne","role":"author"}],"id":"src_d933303080412160","issue":null,"issued":"1633","notes":"The transcription was checked directly against https://archive.org/download/donnepoems/page/n208_w2000.jpg and https://archive.org/download/donnepoems/page/n209_w2000.jpg. OCR was used only to locate the pages.","pages":"193-194","publisher":"Miles Flesher for John Marriot","quality":{"authority":"primary-source","peer_review_status":"not-peer-reviewed","rationale":"The page images reproduce the first printed edition and are the controlling witness for this corpus transcription."},"rights":{"notes":"Internet Archive marks the item with the Creative Commons Public Domain Mark; users should confirm the law applicable in their jurisdiction.","quotation":"permitted","reproduction":"permitted","status":"public-domain"},"source_type":"primary-text","source_type_detail":null,"title":"Poems, by J. Donne. With Elegies on the Authors Death","volume":null},"source_id":"src_d933303080412160","summary":"Lines 13-20 contrast sense-dependent love with a refined, mentally assured bond and enumerate eyes, lips, and hands.","use":"direct-evidence"},{"citation":{"citation_text":"Grierson, commentary on 'A Valediction,' 2:49.","locator":"vol. II, p. 49, note to line 16"},"id":"ev_elemented","relationship":"contextualizes","source":{"access":{"consulted_on":"2026-09-26","obtained_via":"Project Gutenberg UTF-8 transcription 48772-0.txt, mirrored by Internet Archive.","scope_note":"The title matter and commentary headed “A Valediction: Forbidding Mourning” on pages 49-50 were consulted in the Project Gutenberg transcription.","state":"excerpt-consulted"},"canonical_url":"https://www.gutenberg.org/ebooks/48772","citation":"Donne, John. The Poems of John Donne. Edited by Herbert J. C. Grierson. Vol. II, Introduction and Commentary. Oxford: Clarendon Press, 1912, 49-50. Project Gutenberg ebook 48772.","container_title":null,"contributors":[{"name":"John Donne","role":"author"},{"name":"Herbert J. C. Grierson","role":"editor"}],"id":"src_95a01a8318fcf5d6","issue":null,"issued":"1912","notes":"Grierson reports Chambers's astronomical gloss, discusses “elemented,” records manuscript support for “and hands,” and comments on the compass simile.","pages":"49-50","publisher":"Clarendon Press","quality":{"authority":"scholarly-edition","peer_review_status":"editorially-reviewed","rationale":"Grierson's commentary supplies poem-specific historical, astronomical, lexical, and textual notes tied to exact line ranges."},"rights":{"notes":"The 1912 edition and Project Gutenberg transcription are treated as public domain; users outside the United States should confirm local law.","quotation":"permitted","reproduction":"permitted","status":"public-domain"},"source_type":"critical-edition","source_type_detail":null,"title":"The Poems of John Donne, Volume II","volume":"II"},"source_id":"src_95a01a8318fcf5d6","summary":"Grierson explains “elemented” as “composed” and connects “those things” to the physical list in line 20.","use":"direct-evidence"}],"id":"ann_2f9f9630d8c06779","is_base_text":false,"local_key":"refined-love","review":{"notes":"Close-reading and lexical note reviewed by a human editor.","reviewed_on":"2026-09-28","reviewer":"LesTP","state":"human-reviewed"},"tags":["lens-form-argument","lens-bodies-souls","absence"],"target":{"exact_text":"Dull sublunary lovers love\n(Whose soule is sense) cannot admit\nAbsence, because it doth remove\nThose things which elemented it.\n\nBut we by a love, so much refin'd,\nThat our selves know not what it is,\nInter-assured of the mind,\nCare lesse; eyes, lips, hands to misse.","fragments":[{"end":26,"line":13,"start":0},{"end":35,"line":14,"start":0},{"end":31,"line":15,"start":0},{"end":32,"line":16,"start":0},{"end":34,"line":17,"start":0},{"end":36,"line":18,"start":0},{"end":26,"line":19,"start":0},{"end":39,"line":20,"start":0}],"fragments_by_text":{"edition-faithful":[{"end":26,"line":13,"start":0},{"end":35,"line":14,"start":0},{"end":31,"line":15,"start":0},{"end":32,"line":16,"start":0},{"end":34,"line":17,"start":0},{"end":36,"line":18,"start":0},{"end":26,"line":19,"start":0},{"end":39,"line":20,"start":0}],"modernized":[{"end":27,"line":13,"start":0},{"end":34,"line":14,"start":0},{"end":31,"line":15,"start":0},{"end":32,"line":16,"start":0},{"end":34,"line":17,"start":0},{"end":35,"line":18,"start":0},{"end":26,"line":19,"start":0},{"end":37,"line":20,"start":0}]},"line_range":{"end":20,"start":13},"locator":{"scheme":"line","value":"13-20"},"work_id":"work_a_valediction_forbidding_mourning"},"title":"What Physical Absence Removes"},{"annotation_type":"formal","claim":{"attributions":[],"body":"The gold comparison changes the meaning of distance. Hammered gold spreads into extreme thinness without ceasing to be continuous matter, so departure becomes expansion rather than rupture. The image gives a physical form to the apparently paradoxical claim that two souls remain one.","contested":false,"editorial_confidence":{"level":"unassessed","rationale":"The transformation from breach to expansion and the material behavior assigned to gold are explicit; their role in the argument is an editorial reading."},"epistemic_status":"editorial-synthesis"},"evidence":[{"citation":{"citation_text":"Donne, Poems (1633), 194.","locator":"p. 194, lines 21-24"},"id":"ev_beaten_gold","relationship":"supports","source":{"access":{"consulted_on":"2026-09-26","obtained_via":"Internet Archive page images derived from the Google Books scan; printed pages 193-194 were inspected directly at scan leaves 208-209.","state":"fully-consulted"},"canonical_url":"https://archive.org/details/donnepoems","citation":"Donne, John. Poems, by J. Donne. With Elegies on the Authors Death. London: printed by Miles Flesher for John Marriot, 1633, 193-194. Internet Archive, donnepoems.","container_title":null,"contributors":[{"name":"John Donne","role":"author"}],"id":"src_d933303080412160","issue":null,"issued":"1633","notes":"The transcription was checked directly against https://archive.org/download/donnepoems/page/n208_w2000.jpg and https://archive.org/download/donnepoems/page/n209_w2000.jpg. OCR was used only to locate the pages.","pages":"193-194","publisher":"Miles Flesher for John Marriot","quality":{"authority":"primary-source","peer_review_status":"not-peer-reviewed","rationale":"The page images reproduce the first printed edition and are the controlling witness for this corpus transcription."},"rights":{"notes":"Internet Archive marks the item with the Creative Commons Public Domain Mark; users should confirm the law applicable in their jurisdiction.","quotation":"permitted","reproduction":"permitted","status":"public-domain"},"source_type":"primary-text","source_type_detail":null,"title":"Poems, by J. Donne. With Elegies on the Authors Death","volume":null},"source_id":"src_d933303080412160","summary":"Lines 21-24 name the souls as one and replace breach with the expansion of gold beaten thin.","use":"direct-evidence"}],"id":"ann_f08cf33fb713d3b3","is_base_text":false,"local_key":"beaten-gold","review":{"notes":"Close reading reviewed by a human editor.","reviewed_on":"2026-09-28","reviewer":"LesTP","state":"human-reviewed"},"tags":["lens-form-argument","lens-bodies-souls","lens-geometry-cosmology","gold"],"target":{"exact_text":"Our two soules therefore, which are one,\nThough I must goe, endure not yet\nA breach, but an expansion,\nLike gold to ayery thinnesse beate.","fragments":[{"end":40,"line":21,"start":0},{"end":33,"line":22,"start":0},{"end":27,"line":23,"start":0},{"end":35,"line":24,"start":0}],"fragments_by_text":{"edition-faithful":[{"end":40,"line":21,"start":0},{"end":33,"line":22,"start":0},{"end":27,"line":23,"start":0},{"end":35,"line":24,"start":0}],"modernized":[{"end":39,"line":21,"start":0},{"end":32,"line":22,"start":0},{"end":27,"line":23,"start":0},{"end":32,"line":24,"start":0}]},"line_range":{"end":24,"start":21},"locator":{"scheme":"line","value":"21-24"},"work_id":"work_a_valediction_forbidding_mourning"},"title":"A Breach Becomes an Expansion"},{"annotation_type":"formal","claim":{"attributions":[{"evidence_ids":["ev_freccero_compass","ev_freccero_oblique"],"position":"The twin compasses fuse the roaming foot's linear motion through time and space with the fixed foot's circular return, making the drawn circle a figure of eternity; \"just\" puns on a true circle and the virtuous man, and \"obliquely runne\" evokes the planets' wandering, oblique motion.","scholar":"John Freccero"}],"body":"The closing compass image allows the lovers to be two without becoming independent. The fixed foot responds to the roaming foot by leaning toward it and standing upright at its return; the center therefore participates in the journey. The final circle makes fidelity active: one partner's firmness shapes the other's path and brings it back to its beginning. John Freccero reads the conceit within Renaissance cosmology: the compass fuses the roaming foot's straight-line motion through time and distance with the fixed foot's turning, so that the drawn circle becomes a figure of eternity. On his account the pun on a \"just\" circle also names the \"just,\" or virtuous, man of the opening simile, and the roaming foot's \"obliquely runne\" evokes the wandering, oblique path of the planets rather than mere straying. Freccero also ties the poem's scale to its form: its thirty-six lines answer to the 36,000-year \"Great Year\" of classical cosmology, so the whole span of parting reads as one turn of a circle that must return to where it began.","contested":false,"editorial_confidence":{"level":"unassessed","rationale":"The described movements follow the poem's sequence and compass geometry; the cosmological reading is attributed to Freccero, whose essay was consulted in part."},"epistemic_status":"attributed-interpretation"},"evidence":[{"citation":{"citation_text":"Donne, Poems (1633), 194.","locator":"p. 194, lines 25-36"},"id":"ev_compasses","relationship":"supports","source":{"access":{"consulted_on":"2026-09-26","obtained_via":"Internet Archive page images derived from the Google Books scan; printed pages 193-194 were inspected directly at scan leaves 208-209.","state":"fully-consulted"},"canonical_url":"https://archive.org/details/donnepoems","citation":"Donne, John. Poems, by J. Donne. With Elegies on the Authors Death. London: printed by Miles Flesher for John Marriot, 1633, 193-194. Internet Archive, donnepoems." to misse.\n\nOur two soules therefore, which are one,\nThough I must goe, endure not yet\nA breach, but an expansion,\nLike gold to ayery thinnesse beate.\n\nIf they be two; they are two so\nAs stiffe twin compasses are two,\nThy soule the fixt foot, makes no show\nTo move, but doth, if th'other doe.\n\nAnd though it in the center sit,\nYet when the other far doth rome,\nIt leanes, and hearkens after it,\nAnd growes erect, as that comes home.\n\nSuch wilt thou be to mee, who must\nLike th'other foot, obliquely runne,\nThy firmnes makes my circle just,\nAnd makes me end, where I begunne.","fragments":[{"end":34,"line":1,"start":0},{"end":36,"line":2,"start":0},{"end":41,"line":3,"start":0},{"end":38,"line":4,"start":0},{"end":34,"line":5,"start":0},{"end":40,"line":6,"start":0},{"end":32,"line":7,"start":0},{"end":29,"line":8,"start":0},{"end":44,"line":9,"start":0},{"end":33,"line":10,"start":0},{"end":32,"line":11,"start":0},{"end":34,"line":12,"start":0},{"end":26,"line":13,"start":0},{"end":35,"line":14,"start":0},{"end":31,"line":15,"start":0},{"end":32,"line":16,"start":0},{"end":34,"line":17,"start":0},{"end":36,"line":18,"start":0},{"end":26,"line":19,"start":0},{"end":39,"line":20,"start":0},{"end":40,"line":21,"start":0},{"end":33,"line":22,"start":0},{"end":27,"line":23,"start":0},{"end":35,"line":24,"start":0},{"end":31,"line":25,"start":0},{"end":33,"line":26,"start":0},{"end":38,"line":27,"start":0},{"end":35,"line":28,"start":0},{"end":32,"line":29,"start":0},{"end":33,"line":30,"start":0},{"end":33,"line":31,"start":0},{"end":37,"line":32,"start":0},{"end":34,"line":33,"start":0},{"end":36,"line":34,"start":0},{"end":33,"line":35,"start":0},{"end":34,"line":36,"start":0}],"fragments_by_text":{"edition-faithful":[{"end":34,"line":1,"start":0},{"end":36,"line":2,"start":0},{"end":41,"line":3,"start":0},{"end":38,"line":4,"start":0},{"end":34,"line":5,"start":0},{"end":40,"line":6,"start":0},{"end":32,"line":7,"start":0},{"end":29,"line":8,"start":0},{"e       return normalizeState({
        focus: params.get("focus"),
        text: params.get("text"),
        note: params.get("note"),
        line: Number.isInteger(lineValue) && lineValue > 0 ? lineValue : null,
        notes: params.get("notes") === "1",
      });
    }

    function stateHash(candidate) {
      const params = new URLSearchParams();
      params.set("focus", candidate.focus);
      if (candidate.notes) {
        params.set("notes", "1");
      }
      if (textViews.length > 1 || candidate.text !== corpusData.presentation.default_text) {
        params.set("text", candidate.text);
      }
      if (candidate.line) {
        params.set("line", String(candidate.line));
      }
      if (candidate.note) {
        params.set("note", candidate.note);
      }
      return `#${params.toString()}`;
    }

    let state = defaultState();
    state = stateFromHash();
    let suppressFocusActivation = false;
    let suppressAccordionEvents = false;
    let programmaticOpenKey = null;

    function commitState(candidate, historyMode = "push") {
      state = normalizeState(candidate);
      const hash = stateHash(state);
      if (historyMode === "replace") {
        history.replaceState(null, "", hash);
      } else {
        history.pushState(null, "", hash);
      }
      render();
    }

    function renderMasthead() {
      const author = corpusData.corpus.authors.join(", ");
      const combinedPrefix = `${author}: `;
      elements.author.textContent = author;
      elements.title.textContent = corpusData.corpus.title.startsWith(combinedPrefix)
        ? corpusData.corpus.title.slice(combinedPrefix.length)
        : corpusData.corpus.title;
    }

    function applyNotesVisibility() {
      elements.readingLayout.classList.toggle("reading-layout--notes-hidden", !state.notes);
      elements.notesToggle.setAttribute("aria-pressed", String(state.notes));
    }

    function renderControls() {
      for (const button of elements.focusOptions.querySelectorAll("button[data-focus]")) {
        button.setAttribute("aria-pressed", String(button.dataset.focus === state.focus));
      }
      const visible = visibleKeys().length;
      const available = publicAnnotations.length;
      const focusLabel = state.focus === "all" ? "all subjects" : lensesById.get(state.focus).label;
      elements.projectionStatus.textContent = `${visible} of ${available} corpus notes shown · ${focusLabel}`;
    }

    function renderTextSelector() {
      elements.textSelector.replaceChildren();
      elements.textSelector.hidden = textViews.length < 2;
      for (const text of textViews) {
        const button = makeElement("button", null, text.label);
        button.type = "button";
        button.setAttribute("aria-pressed", String(text.id === state.text));
        button.addEventListener("click", () => commitState({...state, text: text.id, note: null, line: null}, "push"));
        elements.textSelector.append(button);
      }
    }

    function renderPoem() {
      elements.poemLines.replaceChildren();
      elements.poemLines.classList.toggle("poem-lines--historical-forms", activeText().historical_forms === true);
      for (const line of activeText().lines) {
        const row = makeElement("div", `poem-line${line.stanza_start ? " poem-line--stanza" : ""}`);
        row.dataset.line = String(line.number);
        row.append(makeElement("span", "poem-line__number", String(line.number)));
        row.append(makeElement("span", "poem-line__text", line.text));
        elements.poemLines.append(row);
      }
      elements.witness.textContent = activeText().provenance_note || `Base witness: ${corpusData.corpus.base_witness.citation}`;
    }

    function renderRichText(text, container) {
      const lines = String(text).split("\n");
      let list = null;
      let paragraph = [];
      const flush = () => {
        if (paragraph.length) {
          container.append(makeElement("p", null, paragraph.join(" ")));
          paragraph = [];
        }
      };
      for (const line of lines) {
        const numbered = line.match(/^\s*\d+\.\s+(.+)$/);
        if (numbered) {
          flush();
          if (!list) {
            list = document.createElement("ol");
            container.append(list);
          }
          list.append(makeElement("li", null, numbered[1]));
        } else if (!line.trim()) {
          flush();
          list = null;
        } else {
          list = null;
          paragraph.push(line.trim());
        }
      }
      flush();
    }

    function metadataLine(label, value) {
      const paragraph = makeElement("p", "source-meta");
      paragraph.append(makeElement("strong", null, `${label}: `), document.createTextNode(value));
      return paragraph;
    }

    function sourceAnchorId(sourceId) {
      return `source-${sourceId}`;
    }

    function openSourceRecord(event, sourceId) {
      const record = document.getElementById(sourceAnchorId(sourceId));
      if (!record) {
        return;
      }
      event.preventDefault();
      elements.sourcesSection.open = true;
      record.open = true;
      record.scrollIntoView({behavior: "smooth", block: "start"});
      record.querySelector("summary")?.focus({preventScroll: true});
    }

    function materialCaveat(annotation) {
      const curated = mockupConfig.public_caveats?.[annotation.local_key];
      if (curated) {
        return curated;
      }
      const limitedEvidence = annotation.evidence.find((evidence) =>
        ["citation-only", "unavailable"].includes(evidence.source.access.state),
      );
      if (limitedEvidence) {
        return "This source has not been consulted directly; see its full record for the limits on its use.";
      }
      return null;
    }

    function renderShortCitations(annotation, container) {
      const list = makeElement("ul", "source-citations");
      for (const evidence of annotation.evidence) {
        const item = document.createElement("li");
        const link = makeElement("a", "note-source-link", evidence.citation.citation_text);
        link.href = `#${sourceAnchorId(evidence.source_id)}`;
        link.addEventListener("click", (event) => openSourceRecord(event, evidence.source_id));
        item.append(link);
        list.append(item);
      }
      container.append(list);
    }

    function activateNote(localKey, historyMode = "replace") {
      if (!annotationsByKey.has(localKey) || !visibleKeys().includes(localKey)) {
        return;
      }
      state = normalizeState({...state, note: localKey, line: preferredLine(localKey)});
      if (historyMode === "push") {
        history.pushState(null, "", stateHash(state));
      } else {
        history.replaceState(null, "", stateHash(state));
      }
      applySelectionStyles();
    }

    function openNote(localKey, programmatic = true) {
      const target = noteNodes.get(localKey);
      programmaticOpenKey = programmatic && target?.isConnected && !target.open
        ? localKey
        : null;
      suppressAccordionEvents = true;
      for (const [key, node] of noteNodes) {
        node.open = key === localKey && node.isConnected;
      }
      suppressAccordionEvents = false;
    }

    function createNoteNode(annotation) {
      const article = makeElement("details", "note-article");
      article.dataset.noteKey = annotation.local_key;
      article.setAttribute("name", "note-corpus");

      const summary = makeElement("summary", "note-summary");
      const heading = makeElement("h3", null, annotation.title);
      heading.id = `note-title-${annotation.local_key}`;
      summary.append(heading);
      article.append(summary);

      const content = makeElement("div", "note-content");
      const claim = makeElement("div", "claim-body");
      renderRichText(annotation.claim.body, claim);
      content.append(claim);

      const details = makeElement("details", "note-details");
      details.append(makeElement("summary", null, "Sources"));
      const body = makeElement("div", "note-details__body");
      renderShortCitations(annotation, body);

      if (annotation.claim.contestation_note) {
        const caveat = makeElement("div", "note-caveat");
        caveat.append(
          makeElement("p", "eyebrow", "Scholarly disagreement"),
          makeElement("p", null, annotation.claim.contestation_note),
        );
        body.append(caveat);
      }

      const limitation = materialCaveat(annotation);
      if (limitation) {
        const caveat = makeElement("div", "note-caveat");
        caveat.append(
          makeElement("p", "eyebrow", "Source limitation"),
          makeElement("p", null, limitation),
        );
        body.append(caveat);
      }
      details.append(body);
      content.append(details);
      article.append(content);

      article.addEventListener("focusin", (event) => {
        if (!suppressFocusActivation && event.target.closest(".note-summary")) {
          activateNote(annotation.local_key);
        }
      });
      article.addEventListener("toggle", () => {
        if (programmaticOpenKey === annotation.local_key) {
          programmaticOpenKey = null;
          return;
        }
        if (suppressAccordionEvents || !article.open) {
          return;
        }
        openNote(annotation.local_key, false);
        activateNote(annotation.local_key, "push");
      });
      return article;
    }

    const noteNodes = new Map(publicAnnotations.map((annotation) => [annotation.local_key, createNoteNode(annotation)]));

    function createGroup(title, keys, number = null) {
      const section = makeElement("section", "stream-group");
      const heading = makeElement("h3", "stream-group__heading");
      if (number !== null) {
        heading.append(makeElement("span", "stream-group__number", String(number)));
      }
      heading.append(makeElement("span", null, title));
      section.append(heading);
      for (const localKey of keys) {
        const node = noteNodes.get(localKey);
        if (node) {
          section.append(node);
        }
      }
      return section;
    }

    function renderNoteStream() {
      elements.noteStream.replaceChildren();
      const keys = visibleKeys();

      if (!keys.length) {
        openNote(null);
        elements.noteStream.append(
          makeElement("p", "empty-state", "No notes match this focus."),
        );
        return;
      }

      const workLevel = keys.filter((key) => mockupConfig.work_level.includes(key));
      const passage = keys.filter((key) => !mockupConfig.work_level.includes(key));
      if (workLevel.length) {
        elements.noteStream.append(createGroup("About the text", workLevel));
      }
      if (passage.length) {
        elements.noteStream.append(createGroup("Alongside the poem", passage));
      }

      const selectedKey = state.note && keys.includes(state.note) ? state.note : null;
      openNote(selectedKey);
      applySelectionStyles();
    }

    function applySelectionStyles() {
      for (const row of elements.poemLines.querySelectorAll(".poem-line")) {
        const lineNumber = Number(row.dataset.line);
        const selected = state.note ? anchorLinesFor(state.note).includes(lineNumber) : false;
        row.classList.toggle("poem-line--selected", selected);
      }
      for (const [localKey, node] of noteNodes) {
        const active = localKey === state.note;
        node.classList.toggle("note-article--active", active);
        if (active) {
          node.setAttribute("aria-current", "true");
        } else {
          node.removeAttribute("aria-current");
        }
      }
    }

    function safeSourceLink(url) {
      try {
        const parsed = new URL(url);
        return ["http:", "https:"].includes(parsed.protocol) ? parsed.href : null;
      } catch {
        return null;
      }
    }

    function contributorText(source) {
      return source.contributors.map((item) => `${item.name} (${item.role})`).join(", ");
    }

    function renderSources() {
      elements.sourceList.replaceChildren();
      const accessOrder = ["fully-consulted", "excerpt-consulted", "citation-only", "unavailable"];
      for (const accessState of accessOrder) {
        const sources = corpusData.sources.filter((source) => source.access.state === accessState);
        if (!sources.length) {
          continue;
        }
        elements.sourceList.append(makeElement("h3", "source-group", `${humanize(accessState)} · ${sources.length}`));
        for (const source of sources) {
          const details = makeElement("details", "source-record");
          details.id = sourceAnchorId(source.id);
          details.append(makeElement("summary", null, source.title));
          const body = makeElement("div", "source-record__body");
          if (source.contributors.length) {
            body.append(metadataLine("Contributors", contributorText(source)));
          }
          body.append(
            metadataLine("Access", humanize(source.access.state)),
            metadataLine("Authority", humanize(source.quality.authority)),
            metadataLine("Review", humanize(source.quality.peer_review_status)),
            metadataLine("Rights", `${humanize(source.rights.status)}; quotation ${humanize(source.rights.quotation)}`),
            makeElement("p", null, source.quality.rationale),
            makeElement("p", "citation", source.citation),
          );
          if (source.access.scope_note) {
            body.append(metadataLine("Consulted scope", source.access.scope_note));
          }
          const href = source.canonical_url ? safeSourceLink(source.canonical_url) : null;
          if (href) {
            const link = makeElement("a", "source-link", "Open source record");
            link.href = href;
            link.target = "_blank";
            link.rel = "noreferrer";
            body.append(link);
          }
          details.append(body);
          elements.sourceList.append(details);
        }
      }
    }

    function render() {
      renderControls();
      applyNotesVisibility();
      renderTextSelector();
      renderPoem();
      renderNoteStream();
      if (state.note) {
        window.requestAnimationFrame(() => noteNodes.get(state.note)?.scrollIntoView({block: "start"}));
      }
    }

    const focusChoices = [
      {id: "all", label: "All subjects"},
      ...corpusData.presentation.lenses.map((lens) => ({id: lens.id, label: lens.label})),
    ];
    for (const choice of focusChoices) {
      const button = makeElement("button", "focus-option", choice.label);
      button.type = "button";
      button.dataset.focus = choice.id;
      button.setAttribute("aria-pressed", "false");
      button.addEventListener("click", () => {
        commitState({...state, focus: choice.id, note: null, line: null}, "push");
      });
      elements.focusOptions.append(button);
    }
    elements.notesToggle.addEventListener("click", () => {
      commitState({...state, notes: !state.notes}, "push");
    });

    function restoreState() {
      state = stateFromHash();
      history.replaceState(null, "", stateHash(state));
      render();
    }

    renderMasthead();
    renderSources();
    history.replaceState(null, "", stateHash(state));
    render();
    window.addEventListener("popstate", restoreState);
    window.addEventListener("hashchange", restoreState);
  </script>
</body>
</html>

notes: >-
  Freccero relates the lovers' separation and return to body-and-soul theology, resurrection, and pneuma; reads melting, elemental composition, refinement, and beaten gold through alchemical dissolution and conjunction; and places the twin compasses within Renaissance and Neoplatonic models of linear motion, circular return, and restored union.

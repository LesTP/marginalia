        So let us melt, and make no noise,
        No tear-floods, nor sigh-tempests move,
        'Twere profanation of our joys
        To tell the laity our love.
annotation_type: thematic
claim:
  body: >-
    The speaker asks the lovers to “melt” apart without theatrical floods of tears or storms of sighs. Calling outsiders “the laity” gives the relationship a private, almost sacred knowledge: public display would expose something the uninitiated cannot fully understand. John Freccero hears an alchemical sense in “melt”: pure gold melts quietly and evenly because its spirit is perfectly joined to its body, unlike base metals that melt noisily, so the lovers are asked to part as gold does—without noise.
  epistemic_status: editorial-synthesis
  editorial_confidence:
    level: unassessed
    rationale: The religious distinction between profanation and laity is present in the stanza; describing the lovers' knowledge as private and quasi-sacred is an editorial synthesis.
  contested: false
  attributions: []

claim:
  body: 'These “twin compasses” are the two-legged instrument for drawing a circle, not a magnetic compass for finding direction. The poem works from the tool itself: its two “feet” (the legs) are joined at the top, and one stays fixed at the centre while the other swings round to draw the circle. Seeing the instrument is what makes the rest legible — the “fixt foot” that sits “in the center,” the “other” that “doth rome,” and the “circle” they trace together.'
  epistemic_status: documented-fact
  editorial_confidence:
    level: unassessed
    rationale: The identification is strictly checkable from the poem's own details (two joined feet, one fixed at the centre, a circle drawn) and is confirmed by Grierson's commentary.
  contested: false
  attributions: []

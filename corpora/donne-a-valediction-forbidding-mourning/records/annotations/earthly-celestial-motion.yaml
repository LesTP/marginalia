annotation_type: historical-context
claim:
  body: >-
    The stanza contrasts a frightening, measurable earthquake with a vastly greater celestial movement that causes no alarm. The comparison makes visible disturbance a poor measure of importance. In Grierson's commentary, Chambers identifies “trepidation” with the precession of the equinoxes as explained through the movement of the ninth or crystalline sphere in Ptolemaic astronomy. John Freccero places the contrast in period cosmology: motion in the sublunary world below the moon was thought changeable and often violent, while the motion of the higher spheres was regular and benign, so the stanza measures the lovers' parting against the calm of the heavens rather than the alarm of the earth. He reads “Moving of th'earth” as an earthquake (terrae motus), a sublunary rupture that brings floods and tempests, rather than a Copernican moving of the earth, and hears in the “trepidation of the spheares” a gentle “access and recess,” a going and returning that does no harm.
  epistemic_status: attributed-interpretation
  editorial_confidence:
    level: unassessed
    rationale: The contrast is explicit in the poem and the astronomical gloss is available through Grierson, but Chambers's original discussion has not been independently consulted.
  contested: false
  attributions:
    - scholar: E. K. Chambers, as quoted by Herbert J. C. Grierson
      position: “Trepidation” refers to precession of the equinoxes, then explained as movement of the ninth or crystalline sphere in Ptolemaic astronomy.
      evidence_ids:

annotation_type: formal
claim:
  body: The gold comparison changes the meaning of distance. Hammered gold spreads into extreme thinness without ceasing to be continuous matter, so departure becomes expansion rather than rupture. The image gives a physical form to the apparently paradoxical claim that two souls remain one.
  epistemic_status: editorial-synthesis
  editorial_confidence:

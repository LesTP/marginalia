    value: "25-36"
  exact_text: |-
    If they be two; they are two so
    As stiffe twin compasses are two,
    Thy soule the fixt foot, makes no show
    To move, but doth, if th'other doe.

    And though it in the center sit,
    Yet when the other far doth rome,
    It leanes, and hearkens after it,
    And growes erect, as that comes home.

    Such wilt thou be to mee, who must
    Like th'other foot, obliquely runne,
    Thy firmnes makes my circle just,
    And makes me end, where I begunne.
  display_selectors:
    - text_id: modernized
      exact_text: |-
        If they be two, they are two so
        As stiff twin compasses are two,
        Thy soul the fixed foot, makes no show
        To move, but doth, if th'other do.

        And though it in the center sit,
        Yet when the other far doth roam,
        It leans, and hearkens after it,
        And grows erect, as that comes home.

        Such wilt thou be to me, who must
        Like th'other foot, obliquely run;
        Thy firmness makes my circle just,
        And makes me end, where I begun.
annotation_type: formal
claim:
  body: >-
    The closing compass image allows the lovers to be two without becoming independent. The fixed foot responds to the roaming foot by leaning toward it and standing upright at its return; the center therefore participates in the journey. The final circle makes fidelity active: one partner's firmness shapes the other's path and brings it back to its beginning. John Freccero reads the conceit within Renaissance cosmology: the compass fuses the roaming foot's straight-line motion through time and distance with the fixed foot's turning, so that the drawn circle becomes a figure of eternity. On his account the pun on a "just" circle also names the "just," or virtuous, man of the opening simile, and the roaming foot's "obliquely runne" evokes the wandering, oblique path of the planets rather than mere straying. Freccero also ties the poem's scale to its form: its thirty-six lines answer to the 36,000-year "Great Year" of classical cosmology, so the whole span of parting reads as one turn of a circle that must return to where it began.

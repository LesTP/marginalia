      exact_text: |-
        Dull sublunary lovers' love
        (Whose soul is sense) cannot admit
        Absence, because it doth remove
        Those things which elemented it.

        But we by a love, so much refined,
        That ourselves know not what it is,
        Inter-assured of the mind,
        Care less, eyes, lips, hands to miss.
annotation_type: thematic
claim:
  body: These stanzas distinguish love composed from sensory presence from a bond so inwardly assured that it can survive missing eyes, lips, and hands. The speaker does not deny the body; he argues that this particular love is not exhausted by the bodily elements that absence removes. Grierson glosses “elemented” as “composed,” pointing forward to the poem's list of physical parts.
  epistemic_status: editorial-synthesis
  editorial_confidence:
    level: unassessed
    rationale: The distinction and bodily list are explicit, while the account of their relationship is an editorial synthesis informed by Grierson's lexical note.
  contested: false
  attributions:
    - scholar: Herbert J. C. Grierson
      position: Grierson glosses “elemented” as “composed” and connects the phrase to the eyes, lips, and hands named in line 20.
      evidence_ids:
        - ev_elemented

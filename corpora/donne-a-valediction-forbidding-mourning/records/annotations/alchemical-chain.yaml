        So let us melt, and make no noise,
        No tear-floods, nor sigh-tempests move,
        'Twere profanation of our joys
        To tell the laity our love.

        Moving of th'earth brings harms and fears,
        Men reckon what it did and meant,
        But trepidation of the spheres,
        Though greater far, is innocent.

        Dull sublunary lovers' love
        (Whose soul is sense) cannot admit
        Absence, because it doth remove
        Those things which elemented it.

        But we by a love, so much refined,
        That ourselves know not what it is,
        Inter-assured of the mind,
        Care less, eyes, lips, hands to miss.

        Our two souls therefore, which are one,
        Though I must go, endure not yet
        A breach, but an expansion,
        Like gold to airy thinness beat.
annotation_type: historical-context
claim:
  body: >-
    The poem returns to material transformation across these stanzas: the lovers “melt”; bodily presence “elemented” ordinary love; their own love is “refin'd”; and their one soul expands like beaten gold. Grierson's gloss of “elemented” as “composed” supplies the lexical hinge. John Freccero reads the sequence through Renaissance alchemy, in which dissolution can separate spirit from body without annihilating either, refinement prepares a purer conjunction, and gold gives restored union a durable material form. The value of the reading is the chain: physical separation becomes a refining passage toward renewed union rather than a series of unrelated decorative images.
  epistemic_status: attributed-interpretation
  editorial_confidence:
    level: unassessed
    rationale: The four textual anchors and cited commentary are directly available, but their unification as an alchemical process remains an attributed interpretation rather than established consensus.
  contested: false
  attributions:
    - scholar: Herbert J. C. Grierson
      position: Grierson glosses “elemented” as “composed” and relates “those things” to the bodily parts named in line 20.
      evidence_ids:
        - ev_chain_grierson_elemented
    - scholar: John Freccero
      position: >-
        Freccero reads “melt,” “refin'd,” and beaten gold as an alchemical pattern in which spirit and body are separated, purified, and reunited without destroying their underlying union.
      evidence_ids:
        - ev_chain_freccero_elements_refinement
        - ev_chain_freccero_melt_reunion
        - ev_chain_freccero_gold_process

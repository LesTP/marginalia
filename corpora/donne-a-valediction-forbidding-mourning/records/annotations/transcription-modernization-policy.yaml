claim:
  body: >-
    The edition-faithful view keeps the 1633 words, spelling, capitalization, punctuation, line order, and stanza divisions while storing long s as ordinary s, expanding no abbreviations, omitting indentation spaces from the encoded text, and representing the initial decorated capital as “AS.” In the review page, IM FELL English Roman and Italic apply contextual historical glyph forms to this view only; presentation metadata restores the witness heading, source-backed author and year, alternating line indentation, and enlarged opening “A.” The display is period-appropriate rather than a facsimile of Miles Flesher's type, and copied text remains ordinary unindented Unicode. The modernized view changes spelling and typographic conventions line by line while preserving wording, syntax, lineation, and stanza structure. It follows Grierson's punctuation at four points: the colon after “no,” the comma after “lesse,” the comma after the first “two,” and the semicolon after “runne.” It adds the possessive apostrophe in “lovers' love” but does not import Grierson's manuscript-supported “and” before “hands.”

    :root {
      --paper: #f3f0e6;
      --paper-light: #fbf9f2;
      --ink: #17221f;
      --ink-soft: #56605a;
      --moon: #476f80;
      --moon-pale: rgba(71, 111, 128, 0.14);
      --gold: #a66f29;
      --rule: rgba(23, 34, 31, 0.2);
      --rule-strong: rgba(23, 34, 31, 0.38);
      --display-serif: "Iowan Old Style", Baskerville, "Palatino Linotype", Palatino, Georgia, serif;
      --serif: "Iowan Old Style", Baskerville, "Palatino Linotype", Palatino, Georgia, serif;
      --poem-serif: "Libre Caslon Text", "Iowan Old Style", Baskerville, "Palatino Linotype", Palatino, Georgia, serif;
      --sans: "Gill Sans", "Trebuchet MS", Candara, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-width: 20rem;
      margin: 0;
      color: var(--ink);
      background:
        repeating-linear-gradient(0deg, rgba(23, 34, 31, 0.018) 0 1px, transparent 1px 5px),
        var(--paper);
      font-family: var(--serif);
    }

    button,
    select {
      font: inherit;
    }

    button:focus-visible,
    select:focus-visible,
    summary:focus-visible,
    a:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid var(--moon);
      outline-offset: 3px;
    }

    [hidden] {
      display: none !important;
    }

    .skip-link {
      position: fixed;
      z-index: 30;
      top: 0.5rem;
      left: 0.5rem;
      padding: 0.7rem 1rem;
      color: var(--paper-light);
      background: var(--ink);
      transform: translateY(-160%);
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .masthead {
      display: grid;
      grid-template-columns: 3rem minmax(0, 1fr) auto;
      gap: 1rem;
      align-items: center;
      max-width: 92rem;
      margin: 0 auto;
      padding: 2.2rem clamp(1.25rem, 4vw, 4rem) 1.8rem;
      border-bottom: 1px solid var(--rule);
    }

    .masthead__mark {
      display: grid;
      width: 2.8rem;
      height: 2.8rem;
      place-items: center;
      color: var(--gold);
      text-decoration: none;
      border: 1px solid var(--gold);
      border-radius: 50%;
      font-size: 1.2rem;
    }

    .masthead__title {
      min-width: 0;
    }

    .masthead__author {
      margin: 0 0 0.45rem;
      color: var(--ink-soft);
      font-family: var(--sans);
      font-size: 1.02rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .eyebrow,
    .notes-toggle,
    .projection-label,
    .projection-status,
    .source-meta,
    .stage-kicker {
      font-family: var(--sans);
      letter-spacing: 0;
    }

    .eyebrow {
      margin: 0 0 0.35rem;
      color: var(--ink-soft);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .masthead h1 {
      max-width: none;
      margin: 0;
      overflow-wrap: normal;
      font-family: var(--display-serif);
      font-size: 3rem;
      font-weight: 400;
      line-height: 1.02;
    }

    .notes-toggle {
      justify-self: end;
      min-height: 2.7rem;

e Celtic movement \"principally the opening of this fountain\" of old stories, and urged Irish writers to master \"this history and these legends.\" Writing an Irish god into an English lyric was part of that program, an attempt to make an ancient national imagination speak to modern readers.","contested":false,"editorial_confidence":{"level":"unassessed","rationale":"The god's identity rests on Yeats's own note, and the cultural program on his own essays; connecting that program to this particular poem is editorial synthesis that a human editor has not yet graded, and it has not been checked against secondary Yeats scholarship."},"epistemic_status":"editorial-synthesis"},"evidence":[{"citation":{"citation_text":"Yeats, The Wind Among the Reeds (1899), notes, pp. 74 and 88-89.","locator":"notes to \"The Song of Wandering Aengus\" and \"The Hosting of the Sidhe\""},"id":"ev_yeats_note_aengus","quotation":"The man in my poem who has a hazel wand may have been Aengus, Master of Love","relationship":"supports","source":{"access":{"consulted_on":"2026-09-23","obtained_via":"Internet Archive page images and OCR; printed pages were checked through the IIIF scan.","state":"fully-consulted"},"canonical_url":"https://archive.org/details/windamongreeds00yeatrich","citation":"Yeats, W. B. The Wind Among the Reeds. London: Elkin Mathews, 1899. Internet Archive, windamongreeds00yeatrich.","container_title":null,"contributors":[{"name":"W. B. Yeats","role":"author"}],"id":"src_e0b122f22eb15e7b","issue":null,"issued":"1899","notes":"The poem was checked directly on printed pages 15-16. Yeats's note on the poem was checked on printed pages 87-89. OCR was used only for navigation.","pages":null,"publisher":"Elkin Mathews","quality":{"authority":"primary-source","peer_review_status":"not-peer-reviewed","rationale":"The scanned 1899 printed volume is the corpus's base textual witness and includes Yeats's own appended notes."},"rights":{"notes":"Published in 1899 and treated as public d ,{"end":31,"line":9,"start":0},{"end":32,"line":10,"start":0},{"end":35,"line":11,"start":0},{"end":33,"line":12,"start":0},{"end":31,"line":13,"start":0},{"end":30,"line":14,"start":0},{"end":32,"line":15,"start":0},{"end":38,"line":16,"start":0},{"end":30,"line":17,"start":0},{"end":37,"line":18,"start":0},{"end":35,"line":19,"start":0},{"end":37,"line":20,"start":0},{"end":34,"line":21,"start":0},{"end":39,"line":22,"start":0},{"end":30,"line":23,"start":0},{"end":29,"line":24,"start":0}]},"line_range":{"end":24,"start":1},"locator":{"scheme":"line","value":"1-24"},"work_id":"work_the_song_of_wandering_aengus"},"title":"An Irish God, Chosen in English"},{"annotation_type":"allusion","claim":{"attributions":[],"body":"The caught trout suddenly becomes a “glimmering girl,” and her disappearance turns a fishing episode into the lifelong search that occupies the poem's ending. In a note appended to the poem, Yeats connects this transformation with Irish beliefs about supernatural beings associated with the goddess Danu: spirits of the water that may appear as fish or as beautiful women.","contested":false,"editorial_confidence":{"level":"unassessed","rationale":"This states the contextual frame supplied by Yeats himself rather than claiming a recoverable single mythic source."},"epistemic_status":"documented-fact"},"evidence":[{"citation":{"citation_text":"Yeats, The Wind Among the Reeds (1899), 87-88.","locator":"pp. 87-88, note to The Song of Wandering Aengus"},"id":"ev_yeats_shapechanging_note","relationship":"supports","source":{"access":{"consulted_on":"2026-09-23","obtained_via":"Internet Archive page images and OCR; printed pages were checked through the IIIF scan.","state":"fully-consulted"},"canonical_url":"https://archive.org/details/windamongreeds00yeatrich","citation":"Yeats, W. B. The Wind Among the Reeds. London: Elkin Mathews, 1899. Internet Archive, windamongreeds00yeatrich.","container_title":null,"contributors":[{"name":"W. B. Yeats","role":"author" ,"start":0},{"end":38,"line":16,"start":0},{"end":30,"line":17,"start":0},{"end":37,"line":18,"start":0},{"end":35,"line":19,"start":0},{"end":37,"line":20,"start":0}]},"line_range":{"end":20,"start":13},"locator":{"scheme":"line","value":"13-20"},"work_id":"work_the_song_of_wandering_aengus"},"title":"A Similar Story from Medieval Ireland"},{"annotation_type":"thematic","claim":{"attributions":[{"evidence_ids":["ev_mazzaro_reports_rudd"],"position":"The glimmering girl and apple blossom are explained through Yeats's description of Maud Gonne.","scholar":"Margaret Rudd, as reported by Jerome L. Mazzaro"},{"evidence_ids":["ev_mazzaro_argument"],"position":"Yeats's earlier apple imagery and reading in Celtic mythology better explain the image than a solely biographical identification.","scholar":"Jerome L. Mazzaro"}],"body":"The apple images connect the girl's first appearance—apple blossom in her hair—with the poem's final promise of silver and golden apples, making her both a particular lost beloved and part of a larger world of myth. Margaret Rudd, as reported by Jerome L. Mazzaro, links the girl to Maud Gonne; Mazzaro rejects that explanation as sufficient and argues that Yeats's earlier apple imagery and Celtic mythology provide a broader context.","contestation_note":"Mazzaro reports that Margaret Rudd identifies the glimmering girl with Maud Gonne through Yeats's apple-blossom description of her; he counters that apple imagery predates their first meeting and belongs to a wider mythological pattern.","contested":true,"editorial_confidence":{"level":"unassessed","rationale":"Both positions are available through Mazzaro's directly consulted scholarly note, but Margaret Rudd's book has not yet been consulted independently."},"epistemic_status":"attributed-interpretation"},"evidence":[{"citation":{"citation_text":"Mazzaro, 'Apple Imagery,' 342.","locator":"p. 342, first paragraph"},"id":"ev_mazzaro_reports_rudd","relationship":"qualifies","source":{"access":{"consu here “a time and times” measures an appointed span that runs until final judgment (Daniel 7:25; Revelation 12:14).","contested":false,"editorial_confidence":{"level":"unassessed","rationale":"The moths, stars, brightening air, moon, and sun are textual facts, and the biblical wording is directly consulted. Reading \"flickering out\" as stars fading before dawn, dating the outing back to evening, and taking the apples as the cycle of nights and days are proposals, not yet checked against published commentary for prior attribution. The biblical echo is verbal; whether Yeats intended it is not claimed."},"epistemic_status":"editorial-proposal"},"evidence":[{"citation":{"citation_text":"Yeats, The Wind Among the Reeds (1899), 15-16.","locator":"pp. 15-16, lines 2-3, 5-6, 16, 22-24"},"id":"ev_night_to_day_sequence","relationship":"supports","source":{"access":{"consulted_on":"2026-09-23","obtained_via":"Internet Archive page images and OCR; printed pages were checked through the IIIF scan.","state":"fully-consulted"},"canonical_url":"https://archive.org/details/windamongreeds00yeatrich","citation":"Yeats, W. B. The Wind Among the Reeds. London: Elkin Mathews, 1899. Internet Archive, windamongreeds00yeatrich.","container_title":null,"contributors":[{"name":"W. B. Yeats","role":"author"}],"id":"src_e0b122f22eb15e7b","issue":null,"issued":"1899","notes":"The poem was checked directly on printed pages 15-16. Yeats's note on the poem was checked on printed pages 87-89. OCR was used only for navigation.","pages":null,"publisher":"Elkin Mathews","quality":{"authority":"primary-source","peer_review_status":"not-peer-reviewed","rationale":"The scanned 1899 printed volume is the corpus's base textual witness and includes Yeats's own appended notes."},"rights":{"notes":"Published in 1899 and treated as public domain for this corpus; users should confirm the law applicable in their jurisdiction.","quotation":"permitted","reproduction":"permitted","status":"public-domain"},"source_ty           const leftLine = preferredLine(left) ?? Number.MAX_SAFE_INTEGER;
          const rightLine = preferredLine(right) ?? Number.MAX_SAFE_INTEGER;
          return leftLine - rightLine || annotationOrder.get(left) - annotationOrder.get(right);
        });
    }

    function visibleKeys() {
      const ordered = poemOrderKeys();
      if (state.focus === "all") {
        return ordered;
      }
      const admitted = new Set(lensesById.get(state.focus)?.annotation_keys || []);
      return ordered.filter((localKey) => admitted.has(localKey));
    }

    function defaultState() {
      return {
        focus: "all",
        text: corpusData.presentation.default_text || textViews[0].id,
        note: null,
        line: null,
        notes: false,
      };
    }

    function normalizeState(candidate) {
      const next = {
        focus: candidate.focus === "all" || lensesById.has(candidate.focus) ? candidate.focus : "all",
        text: textsById.has(candidate.text) ? candidate.text : (corpusData.presentation.default_text || textViews[0].id),
        note: annotationsByKey.has(candidate.note) ? candidate.note : null,
        line: Number.isInteger(candidate.line) && candidate.line > 0 ? candidate.line : null,
        notes: candidate.notes === true,
      };
      const admitted = new Set(projectedKeys(next.focus, next.text));
      if (next.note && !admitted.has(next.note)) {
        next.note = null;
        next.line = null;
      }
      if (next.note && !next.line) {
        next.line = preferredLine(next.note, next.text);
      }
      return next;
    }

    function projectedKeys(focus, textId) {
      const ordered = publicAnnotations.map((annotation) => annotation.local_key).sort((left, right) => {
        const leftWork = mockupConfig.work_level.includes(left);
        const rightWork = mockupConfig.work_level.includes(right);
        if (leftWork !== rightWork) {
          return leftWork ? -1 : 1;
        }
        const leftLine = preferredLine(left, textId || corpusData.presentation.default_text) ?? Number.MAX_SAFE_INTEGER;
        const rightLine = preferredLine(right, textId || corpusData.presentation.default_text) ?? Number.MAX_SAFE_INTEGER;
        return leftLine - rightLine || annotationOrder.get(left) - annotationOrder.get(right);
      });
      if (focus === "all") {
        return ordered;
      }
      const admitted = new Set(lensesById.get(focus)?.annotation_keys || []);
      return ordered.filter((key) => admitted.has(key));
    }

    function stateFromHash() {
      if (!window.location.hash) {
        return defaultState();
      }
      const params = new URLSearchParams(window.location.hash.slice(1));
      const lineValue = Number(params.get("line"));
      return normalizeState({
        focus: params.get("focus"),
        text: params.get("text"),
        note: params.get("note"),
        line: Number.isInteger(lineValue) && lineValue > 0 ? lineValue : null,
        notes: params.get("notes") === "1",
      });
    }

    function stateHash(candidate) {
      const params = new URLSearchParams();
      params.set("focus", candidate.focus);
      if (candidate.notes) {
        params.set("notes", "1");
      }
      if (textViews.length > 1 || candidate.text !== corpusData.presentation.default_text) {
        params.set("text", candidate.text);
      }
      if (candidate.line) {
        params.set("line", String(candidate.line));
      }
      if (candidate.note) {
        params.set("note", candidate.note);
      }
      return `#${params.toString()}`;
    }

    let state = defaultState();
    state = stateFromHash();
    let suppressFocusActivation = false;
    let suppressAccordionEvents = false;
    let programmaticOpenKey = null;

    function commitState(candidate, historyMode = "push") {
      state = normalizeState(candidate);
      const hash = stateHash(state);
      if (historyMode === "replace") {
        history.replaceState(null, "", hash);
      } else {
        history.pushState(null, "", hash);
      }
      render();
    }

    function renderMasthead() {
      const author = corpusData.corpus.authors.join(", ");
      const combinedPrefix = `${author}: `;
      elements.author.textContent = author;
      elements.title.textContent = corpusData.corpus.title.startsWith(combinedPrefix)
        ? corpusData.corpus.title.slice(combinedPrefix.length)
        : corpusData.corpus.title;
    }

    function applyNotesVisibility() {
      elements.readingLayout.classList.toggle("reading-layout--notes-hidden", !state.notes);
      elements.notesToggle.setAttribute("aria-pressed", String(state.notes));
    }

    function renderControls() {
      for (const button of elements.focusOptions.querySelectorAll("button[data-focus]")) {
        button.setAttribute("aria-pressed", String(button.dataset.focus === state.focus));
      }
      const visible = visibleKeys().length;
      const available = publicAnnotations.length;
      const focusLabel = state.focus === "all" ? "all subjects" : lensesById.get(state.focus).label;
      elements.projectionStatus.textContent = `${visible} of ${available} corpus notes shown · ${focusLabel}`;
    }

    function renderTextSelector() {
      elements.textSelector.replaceChildren();
      elements.textSelector.hidden = textViews.length < 2;
      for (const text of textViews) {
        const button = makeElement("button", null, text.label);
        button.type = "button";
        button.setAttribute("aria-pressed", String(text.id === state.text));
        button.addEventListener("click", () => commitState({...state, text: text.id, note: null, line: null}, "push"));
        elements.textSelector.append(button);
      }
    }

    function renderPoem() {
      elements.poemLines.replaceChildren();
      for (const line of activeText().lines) {
        const row = makeElement("div", `poem-line${line.stanza_start ? " poem-line--stanza" : ""}`);
        row.dataset.line = String(line.number);
        row.append(makeElement("span", "poem-line__number", String(line.number)));
        row.append(makeElement("span", "poem-line__text", line.text));
        elements.poemLines.append(row);
      }
      elements.witness.textContent = activeText().provenance_note || `Base witness: ${corpusData.corpus.base_witness.citation}`;
    }

    function renderRichText(text, container) {
      const lines = String(text).split("\n");
      let list = null;
      let verse = null;
      let verseHeads = 0;
      let verseOpening = false;
      let paragraph = [];
      const flush = () => {
        if (paragraph.length) {
          container.append(makeElement("p", null, paragraph.join(" ")));
          paragraph = [];
        }
      };
      for (const line of lines) {
        const verseLine = line.match(/^\s*\|([\^>]?)\s?(.*)$/);
        if (verseLine) {
          flush();
          list = null;
          if (!verse) {
            verse = makeElement("p", "verse");
            container.append(verse);
            verseHeads = 0;
            verseOpening = true;
          }
          const [, kind, content] = verseLine;
          if (kind === "^") {
            verse.append(makeElement("span", verseHeads ? "verse-line verse-head" : "verse-line verse-head verse-title", content));
            verseHeads += 1;
          } else if (kind === ">") {
            verse.append(makeElement("span", "verse-line verse-right", content));
          } else if (verseOpening && verseHeads) {
            const [, first, rest] = content.match(/^(\S*)(.*)$/);
            const node = makeElement("span", "verse-line verse-first");
            node.append(makeElement("span", "verse-initial", first), makeElement("span", null, rest));
            verse.append(node);
            verseOpening = false;
          } else {
            verse.append(makeElement("span", "verse-line", content));
            verseOpening = false;
          }
          continue;
        }
        verse = null;
        const numbered = line.match(/^\s*\d+\.\s+(.+)$/);
        if (numbered) {
          flush();
          if (!list) {
            list = document.createElement("ol");
            container.append(list);
          }
          list.append(makeElement("li", null, numbered[1]));
        } else if (!line.trim()) {
          flush();
          list = null;
        } else {
          list = null;
          paragraph.push(line.trim());
        }
      }
      flush();
    }

    function metadataLine(label, value) {
      const paragraph = makeElement("p", "source-meta");
      paragraph.append(makeElement("strong", null, `${label}: `), document.createTextNode(value));
      return paragraph;
    }

    function sourceAnchorId(sourceId) {
      return `source-${sourceId}`;
    }

    function openSourceRecord(event, sourceId) {
      const record = document.getElementById(sourceAnchorId(sourceId));
      if (!record) {
        return;
      }
      event.preventDefault();
      elements.sourcesSection.open = true;
      record.open = true;
      record.scrollIntoView({behavior: "smooth", block: "start"});
      record.querySelector("summary")?.focus({preventScroll: true});
    }

    function materialCaveat(annotation) {
      const curated = mockupConfig.public_caveats?.[annotation.local_key];
      if (curated) {
        return curated;
      }
      const limitedEvidence = annotation.evidence.find((evidence) =>
        ["citation-only", "unavailable"].includes(evidence.source.access.state),
      );
      if (limitedEvidence) {
        return "This source has not been consulted directly; see its full record for the limits on its use.";
      }
      return null;
    }

    function renderShortCitations(annotation, container) {
      const list = makeElement("ul", "source-citations");
      for (const evidence of annotation.evidence) {
        const item = document.createElement("li");
        const link = makeElement("a", "note-source-link", evidence.citation.citation_text);
        link.href = `#${sourceAnchorId(evidence.source_id)}`;
        link.addEventListener("click", (event) => openSourceRecord(event, evidence.source_id));
        item.append(link);
        list.append(item);
      }
      container.append(list);
    }

    function activateNote(localKey, historyMode = "replace") {
      if (!annotationsByKey.has(localKey) || !visibleKeys().includes(localKey)) {
        return;
      }
      state = normalizeState({...state, note: localKey, line: preferredLine(localKey)});
      if (historyMode === "push") {
        history.pushState(null, "", stateHash(state));
      } else {
        history.replaceState(null, "", stateHash(state));
      }
      applySelectionStyles();
    }

    function openNote(localKey, programmatic = true) {
      const target = noteNodes.get(localKey);
      programmaticOpenKey = programmatic && target?.isConnected && !target.open
        ? localKey
        : null;
      suppressAccordionEvents = true;
      for (const [key, node] of noteNodes) {
        node.open = key === localKey && node.isConnected;
      }
      suppressAccordionEvents = false;
    }

    function createNoteNode(annotation) {
      const article = makeElement("details", "note-article");
      article.dataset.noteKey = annotation.local_key;
      article.setAttribute("name", "note-corpus");

      const summary = makeElement("summary", "note-summary");
      const heading = makeElement("h3", null, annotation.title);
      heading.id = `note-title-${annotation.local_key}`;
      summary.append(heading);
      article.append(summary);

      const content = makeElement("div", "note-content");
      const claim = makeElement("div", "claim-body");
      renderRichText(annotation.claim.body, claim);
      content.append(claim);

      const details = makeElement("details", "note-details");
      details.append(makeElement("summary", null, "Sources"));
      const body = makeElement("div", "note-details__body");
      renderShortCitations(annotation, body);

      if (annotation.claim.contestation_note) {
        const caveat = makeElement("div", "note-caveat");
        caveat.append(
          makeElement("p", "eyebrow", "Scholarly disagreement"),
          makeElement("p", null, annotation.claim.contestation_note),
        );
        body.append(caveat);
      }

      const limitation = materialCaveat(annotation);
      if (limitation) {
        const caveat = makeElement("div", "note-caveat");
        caveat.append(
          makeElement("p", "eyebrow", "Source limitation"),
          makeElement("p", null, limitation),
        );
        body.append(caveat);
      }
      details.append(body);
      content.append(details);
      article.append(content);

      article.addEventListener("focusin", (event) => {
        if (!suppressFocusActivation && event.target.closest(".note-summary")) {
          activateNote(annotation.local_key);
        }
      });
      article.addEventListener("toggle", () => {
        if (programmaticOpenKey === annotation.local_key) {
          programmaticOpenKey = null;
          return;
        }
        if (suppressAccordionEvents || !article.open) {
          return;
        }
        openNote(annotation.local_key, false);
        activateNote(annotation.local_key, "push");
      });
      return article;
    }

    const noteNodes = new Map(publicAnnotations.map((annotation) => [annotation.local_key, createNoteNode(annotation)]));

    function createGroup(title, keys, number = null) {
      const section = makeElement("section", "stream-group");
      const heading = makeElement("h3", "stream-group__heading");
      if (number !== null) {
        heading.append(makeElement("span", "stream-group__number", String(number)));
      }
      heading.append(makeElement("span", null, title));
      section.append(heading);
      for (const localKey of keys) {
        const node = noteNodes.get(localKey);
        if (node) {
          section.append(node);
        }
      }
      return section;
    }

    function renderNoteStream() {
      elements.noteStream.replaceChildren();
      const keys = visibleKeys();

      if (!keys.length) {
        openNote(null);
        elements.noteStream.append(
          makeElement("p", "empty-state", "No notes match this focus."),
        );
        return;
      }

      const workLevel = keys.filter((key) => mockupConfig.work_level.includes(key));
      const passage = keys.filter((key) => !mockupConfig.work_level.includes(key));
      if (workLevel.length) {
        elements.noteStream.append(createGroup("About the text", workLevel));
      }
      if (passage.length) {
        elements.noteStream.append(createGroup("Alongside the poem", passage));
      }

      const selectedKey = state.note && keys.includes(state.note) ? state.note : null;
      openNote(selectedKey);
      applySelectionStyles();
    }

    function applySelectionStyles() {
      for (const row of elements.poemLines.querySelectorAll(".poem-line")) {
        const lineNumber = Number(row.dataset.line);
        const selected = state.note ? anchorLinesFor(state.note).includes(lineNumber) : false;
        row.classList.toggle("poem-line--selected", selected);
      }
      for (const [localKey, node] of noteNodes) {
        const active = localKey === state.note;
        node.classList.toggle("note-article--active", active);
        if (active) {
          node.setAttribute("aria-current", "true");
        } else {
          node.removeAttribute("aria-current");
        }
      }
    }

    function safeSourceLink(url) {
      try {
        const parsed = new URL(url);
        return ["http:", "https:"].includes(parsed.protocol) ? parsed.href : null;
      } catch {
        return null;
      }
    }

    function contributorText(source) {
      return source.contributors.map((item) => `${item.name} (${item.role})`).join(", ");
    }

    function renderSources() {
      elements.sourceList.replaceChildren();
      const accessOrder = ["fully-consulted", "excerpt-consulted", "citation-only", "unavailable"];
      for (const accessState of accessOrder) {
        const sources = corpusData.sources.filter((source) => source.access.state === accessState);
        if (!sources.length) {
          continue;
        }
        elements.sourceList.append(makeElement("h3", "source-group", `${humanize(accessState)} · ${sources.length}`));
        for (const source of sources) {
          const details = makeElement("details", "source-record");
          details.id = sourceAnchorId(source.id);
          details.append(makeElement("summary", null, source.title));
          const body = makeElement("div", "source-record__body");
          if (source.contributors.length) {
            body.append(metadataLine("Contributors", contributorText(source)));
          }
          body.append(
            metadataLine("Access", humanize(source.access.state)),
            metadataLine("Authority", humanize(source.quality.authority)),
            metadataLine("Review", humanize(source.quality.peer_review_status)),
            metadataLine("Rights", `${humanize(source.rights.status)}; quotation ${humanize(source.rights.quotation)}`),
            makeElement("p", null, source.quality.rationale),
            makeElement("p", "citation", source.citation),
          );
          if (source.access.scope_note) {
            body.append(metadataLine("Consulted scope", source.access.scope_note));
          }
          const href = source.canonical_url ? safeSourceLink(source.canonical_url) : null;
          if (href) {
            const link = makeElement("a", "source-link", "Open source record");
            link.href = href;
            link.target = "_blank";
            link.rel = "noreferrer";
            body.append(link);
          }
          details.append(body);
          elements.sourceList.append(details);
        }
      }
    }

    function render() {
      renderControls();
      applyNotesVisibility();
      renderTextSelector();
      renderPoem();
      renderNoteStream();
      if (state.note) {
        window.requestAnimationFrame(() => noteNodes.get(state.note)?.scrollIntoView({block: "start"}));
      }
    }

    const focusChoices = [
      {id: "all", label: "All subjects"},
      ...corpusData.presentation.lenses.map((lens) => ({id: lens.id, label: lens.label})),
    ];
    for (const choice of focusChoices) {
      const button = makeElement("button", "focus-option", choice.label);
      button.type = "button";
      button.dataset.focus = choice.id;
      button.setAttribute("aria-pressed", "false");
      button.addEventListener("click", () => {
        commitState({...state, focus: choice.id, note: null, line: null}, "push");
      });
      elements.focusOptions.append(button);
    }
    elements.notesToggle.addEventListener("click", () => {
      commitState({...state, notes: !state.notes}, "push");
    });

    function restoreState() {
      state = stateFromHash();
      history.replaceState(null, "", stateHash(state));
      render();
    }

    renderMasthead();
    renderSources();
    history.replaceState(null, "", stateHash(state));
    render();
    window.addEventListener("popstate", restoreState);
    window.addEventListener("hashchange", restoreState);
  </script>
</body>
</html>

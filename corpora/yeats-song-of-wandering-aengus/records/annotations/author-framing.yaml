    scheme: line
    value: "7-16"
  exact_text: |-
    I dropped the berry in a stream
    And caught a little silver trout.

    When I had laid it on the floor
    I went to blow the fire a-flame,
    But something rustled on the floor,
    And someone called me by my name:
    It had become a glimmering girl
    With apple blossom in her hair
    Who called me by my name and ran
    And faded through the brightening air.
annotation_type: historical-context
claim:
  body: "The poem brings together two different imaginative sources: a Greek folk song suggested its basic situation, while Yeats pictured the events taking place in an Ireland inhabited by spirits. Yeats gives this account in the note he appended to the poem, so it describes his own framing of the work rather than proving that every image comes from one recoverable tale."
  epistemic_status: documented-fact
  editorial_confidence:
    level: unassessed
    rationale: The claim paraphrases Yeats's signed authorial note, checked on the printed pages; a human editor has reviewed it, and no formal confidence grade has been assigned.

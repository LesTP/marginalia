  work_id: work_the_song_of_wandering_aengus
  edition_source_id: src_e0b122f22eb15e7b
  locator:
    scheme: line
    value: "1-24"
  exact_text: |-
    I went out to the hazel wood,
    Because a fire was in my head,
    And cut and peeled a hazel wand,
    And hooked a berry to a thread;
    And when white moths were on the wing,
    And moth-like stars were flickering out,
    I dropped the berry in a stream
    And caught a little silver trout.

    When I had laid it on the floor
    I went to blow the fire a-flame,
    But something rustled on the floor,
    And someone called me by my name:
    It had become a glimmering girl
    With apple blossom in her hair
    Who called me by my name and ran
    And faded through the brightening air.

    Though I am old with wandering
    Through hollow lands and hilly lands,
    I will find out where she has gone,
    And kiss her lips and take her hands;
    And walk among long dappled grass,
    And pluck till time and times are done,
    The silver apples of the moon,
    The golden apples of the sun.
annotation_type: thematic
claim:
  body: "The poem keeps time by the sky. White moths are still on the wing and the “moth-like stars” are flickering out, going dark before dawn, so the speaker fishes in the last hour of night. Counting back, the “fire” in his head sends him out in the evening, and he cuts and peels his hazel wand in the dark. The girl then fades “through the brightening air” as daylight comes: the encounter lasts no longer than the night. The closing apples widen that single night into the whole cycle of nights and days, silver for the moon and gold for the sun, gathered “till time and times are done.” The phrase echoes the King James Bible, where “a time and times” measures an appointed span that runs until final judgment (Daniel 7:25; Revelation 12:14)."
  epistemic_status: editorial-proposal
  editorial_confidence:
    level: unassessed
    rationale: The moths, stars, brightening air, moon, and sun are textual facts, and the biblical wording is directly consulted. Reading "flickering out" as stars fading before dawn, dating the outing back to evening, and taking the apples as the cycle of nights and days are proposals, not yet checked against published commentary for prior attribution. The biblical echo is verbal; whether Yeats intended it is not claimed.
  contested: false
  attributions: []

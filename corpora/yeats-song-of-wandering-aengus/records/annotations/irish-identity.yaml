target:
  work_id: work_the_song_of_wandering_aengus
  edition_source_id: src_e0b122f22eb15e7b
  locator:
    scheme: line
    value: "1-24"
  exact_text: |-
    I went out to the hazel wood,
    Because a fire was in my head,
    And cut and peeled a hazel wand,
    And hooked a berry to a thread;
    And when white moths were on the wing,
    And moth-like stars were flickering out,
    I dropped the berry in a stream
    And caught a little silver trout.

    When I had laid it on the floor
    I went to blow the fire a-flame,
    But something rustled on the floor,
    And someone called me by my name:
    It had become a glimmering girl
    With apple blossom in her hair
    Who called me by my name and ran
    And faded through the brightening air.

    Though I am old with wandering
    Through hollow lands and hilly lands,
    I will find out where she has gone,
    And kiss her lips and take her hands;
    And walk among long dappled grass,
    And pluck till time and times are done,
    The silver apples of the moon,
    The golden apples of the sun.
annotation_type: historical-context
claim:
  body: "The poem's wandering hero is Aengus, a god of the old Irish otherworld, and its hazel wood and silver and golden apples belong to that same world. In his own note Yeats identifies the man with the hazel wand as \"Aengus, Master of Love,\" one of the Tuatha De Danaan, the ancient Irish gods whom country people still called the Sidhe. Choosing such a figure was not a neutral literary decision. Through the 1890s Yeats worked to build a modern Irish literature out of Gaelic legend: he called the Celtic movement \"principally the opening of this fountain\" of old stories, and urged Irish writers to master \"this history and these legends.\" Writing an Irish god into an English lyric was part of that program, an attempt to make an ancient national imagination speak to modern readers."
  epistemic_status: editorial-synthesis
  editorial_confidence:
    level: unassessed
    rationale: The god's identity rests on Yeats's own note, and the cultural program on his own essays; connecting that program to this particular poem is editorial synthesis that a human editor has not yet graded, and it has not been checked against secondary Yeats scholarship.
  contested: false
  attributions: []
evidence:

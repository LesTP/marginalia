    source_id: src_e0b122f22eb15e7b
    relationship: supports
    use: direct-evidence
    summary: Yeats's own 1899 note identifies the poem's hazel-wand man as Aengus, Master of Love, one of the children of the goddess Danu, and his notes explain that the Tuatha De Danaan were the old gods of Ireland, called the Sidhe by the poor.
    citation:
      locator: notes to "The Song of Wandering Aengus" and "The Hosting of the Sidhe"
      citation_text: "Yeats, The Wind Among the Reeds (1899), notes, pp. 74 and 88-89."
    quotation: "The man in my poem who has a hazel wand may have been Aengus, Master of Love"
  - id: ev_celtic_twilight_face_of_ireland
    source_id: src_9a4ff9f4b44ea1e9
    relationship: supports
    use: direct-evidence
    summary: In the dedicatory preface to The Celtic Twilight, Yeats frames his folklore work as national in purpose, aimed at showing Ireland to his own people.
    citation:
      locator: dedicatory preface, "This Book" (dated 1893)
      citation_text: "Yeats, The Celtic Twilight (1902), 'This Book'."
    quotation: "to show in a vision something of the face of Ireland to any of my own people who would look where I bid them"
  - id: ev_ige_celtic_movement
    source_id: src_890993afc1055265
    relationship: supports
    use: direct-evidence
    summary: In "The Celtic Element in Literature" Yeats defines the Celtic movement as the opening of a great "fountain" of Gaelic legend, and in "Ireland and the Arts" he urges Irish writers to master the country's history and legends, evidence of the cultural-nationalist program behind his use of Irish myth.
    citation:
      locator: essays "The Celtic Element in Literature" (IV) and "Ireland and the Arts"
      citation_text: "Yeats, Ideas of Good and Evil (1903), 'The Celtic Element in Literature' and 'Ireland and the Arts'."
    quotation: "'The Celtic movement,' as I understand it, is principally the opening of this fountain"

    value: "13-20"
  exact_text: |-
    It had become a glimmering girl
    With apple blossom in her hair
    Who called me by my name and ran
    And faded through the brightening air.

    Though I am old with wandering
    Through hollow lands and hilly lands,
    I will find out where she has gone,
    And kiss her lips and take her hands;
annotation_type: intertext
claim:
  body: "Yeats's poem resembles a medieval Irish story in which Óengus dreams of a supernatural woman, loses her, and searches for her. In Aislinge Óenguso (The Dream of Óengus), the woman is Caer, who alternates between human and bird form; Óengus eventually joins her as a swan. The shared pattern of disappearance and search helps illuminate the poem, but the transformations differ, and the resemblance does not prove that the tale was Yeats's sole or direct source."
  epistemic_status: editorial-synthesis
  editorial_confidence:
    level: unassessed
    rationale: The comparison uses directly consulted texts and scholarship, but its relevance to the poem requires human interpretive review.

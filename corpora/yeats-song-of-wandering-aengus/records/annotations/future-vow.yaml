  exact_text: |-
    I will find out where she has gone,
    And kiss her lips and take her hands;
    And walk among long dappled grass,
    And pluck till time and times are done,
annotation_type: thematic
claim:
  body: "The ending promises continued searching rather than showing a reunion. “I will” begins a chain of future actions, while “till time and times are done” places their fulfillment beyond ordinary duration and beyond the poem itself."
  epistemic_status: editorial-proposal
  editorial_confidence:

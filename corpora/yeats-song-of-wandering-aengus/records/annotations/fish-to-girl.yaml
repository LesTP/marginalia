  locator:
    scheme: line
    value: "7-16"
  exact_text: |-
    I dropped the berry in a stream
    And caught a little silver trout.

    When I had laid it on the floor
    I went to blow the fire a-flame,
    But something rustled on the floor,
    And someone called me by my name:
    It had become a glimmering girl
    With apple blossom in her hair
    Who called me by my name and ran
    And faded through the brightening air.
annotation_type: allusion
claim:
  body: "The caught trout suddenly becomes a “glimmering girl,” and her disappearance turns a fishing episode into the lifelong search that occupies the poem's ending. In a note appended to the poem, Yeats connects this transformation with Irish beliefs about supernatural beings associated with the goddess Danu: spirits of the water that may appear as fish or as beautiful women."
  epistemic_status: documented-fact
  editorial_confidence:
    level: unassessed
    rationale: This states the contextual frame supplied by Yeats himself rather than claiming a recoverable single mythic source.

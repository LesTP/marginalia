  locator:
    scheme: line
    value: "14-24"
  exact_text: |-
    With apple blossom in her hair
    Who called me by my name and ran
    And faded through the brightening air.

    Though I am old with wandering
    Through hollow lands and hilly lands,
    I will find out where she has gone,
    And kiss her lips and take her hands;
    And walk among long dappled grass,
    And pluck till time and times are done,
    The silver apples of the moon,
    The golden apples of the sun.
annotation_type: intertext
claim:
  body: |-
    Yeats says only that the poem was suggested by a Greek folk song. A strong candidate is "The Fruit of the Apple-Tree," published in 1885 in English translation by Lucy M. J. Garnett.

    |^ THE FRUIT OF THE APPLE-TREE.
    |^ Ο ΚΑΡΠΟΣ ΤΗΣ ΜΗΛΗΑΣ.
    |^ Ὁ νειὸς μέ τὰ λαγωνικὰ ἐβγῆκε ’ς τὸ κυνῆγι
    |^ κ’ ἐκράτει καὶ ’ς τὸ χέρι του ἕνα μικρὸ γεράκι.
    |> κ. τ. λ.
    |^ (Aravandinos, 240.)
    | With all his greyhounds fleet around, a youth goes out a-hunting;
    | A falcon small upon his wrist he bears as forth he sallies.
    | It frees itself, and flies afar, and in a garden enters;
    | But quick, his falcon to regain, the hunter follows after.
    | A maiden fair within he finds, at marble fountain washing;
    | With whitest pearls she is bedecked, and strings of golden sequins.
    | ‘Call off thy dogs, Sir Hunter bold, and tie them to the bushes!
    | I fear they’ll bite me, Hunter bold—I fear that they will chase me.’
    | ‘My little dogs are better taught, ’tis only hares they worry;
    | And ne’er to maidens fair as thou do any kind of evil.
    | O tell me, tell me, maiden mine, what dowry canst thou bring me?
    | No dowry do I ask of coin, nor dowry of adornment.’
    | ‘No dowry dost thou ask of coin, nor dowry of adornment?
    | Then will I give this apple-tree, all covered o’er with blossom;
    | All laden, too, with rosy fruit, with fairest, sweetest apples.’
    | ‘Thou, maiden, art the apple-tree, and now let fall the apples!’
    | She broke the strings, and far and wide her pearls and sequins scattered.
    | ‘Come, gather, youth! come, gather them, the apples of my fruit-tree;
    | And gather them again, again, and stoop again and gather!’

  exact_text: |-
    Because a fire was in my head,
    And cut and peeled a hazel wand,
    And hooked a berry to a thread;
    And when white moths were on the wing,
    And moth-like stars were flickering out,
    I dropped the berry in a stream
    And caught a little silver trout.

    When I had laid it on the floor
    I went to blow the fire a-flame,
annotation_type: thematic
claim:
  body: "Two fires frame the catch. A “fire” in the speaker's head sends him out to the hazel wood; back indoors, he goes to “blow the fire a-flame” on his own hearth. The first is an inner compulsion, the second an ordinary household task, and the transformation interrupts the second: we don't know if the speaker ever lights the hearth. As he turns to tend the domestic fire, the trout becomes the girl who will set him wandering."
  epistemic_status: editorial-proposal
  editorial_confidence:
    level: unassessed
    rationale: Both fires and the interruption are textual facts. Treating them as a deliberate pairing of inner compulsion and household task is a proposal, not yet checked against published commentary for prior attribution.

notes: The IIIF manifest's canvas labels do not match printed page numbers (the canvas labelled 133 is printed page 96); use canvases 169-170 for printed pages 133-134. The corpus transcription keeps the printed wording and punctuation but drops the typographic space printed before semicolons, exclamation marks, and question marks. In the Greek heading and opening lines, the printed curly beta (ϐ) and kappa (ϰ) are written as ordinary β and κ; spelling (including ΜΗΛΗΑΣ and νειὸς) and accents follow the page.

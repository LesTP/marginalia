[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reference-corpus-template"
version = "0.1.0"
description = "Source-first YAML contracts and validation for literary annotations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.20",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
reference-corpus-render = "reference_corpus.review:main"
reference-corpus-validate = "reference_corpus.validate:main"

[tool.setuptools.package-data]
reference_corpus = [
    "web/*.css",
    "web/*.html",
    "web/*.js",
    "web/fonts/*.ttf",
    "web/fonts/*.txt",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
